# Nginx — allow student photo uploads (base64 JSON) to the API

If large photo registration fails with a connection error or HTTP 413,
increase the body size on the API vhost:

```nginx
server {
    # ...
    client_max_body_size 25m;
    # ...
}
```

Then reload nginx: `sudo nginx -t && sudo systemctl reload nginx`

The app accepts original photos up to **10 MB** and compresses them in the
browser before upload. The API accepts decoded images up to **10 MB**.
