name: Desktop payload

on:
  push:
    branches: [main, master]
    paths:
      - "web-front/**"
      - "!web-front/dist/**"
      - "mobile-back/**"
      - "!mobile-back/scripts/**"
      - "desktop/electron/**"
      - "desktop/scripts/**"
      - "desktop/software-manifest.json"
      - "desktop/package.json"
      - ".github/workflows/desktop-payload.yml"
  workflow_dispatch:

concurrency:
  group: desktop-payload-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-front/package-lock.json

      - name: Install web UI
        run: npm ci
        working-directory: web-front

      - name: Build payload zip
        run: node desktop/scripts/build-payload.js --write-manifest --repo "${{ github.repository }}" --commit "${{ github.sha }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/release-payload/payload-meta.json').version")
          TAG=$(node -p "require('./desktop/release-payload/payload-meta.json').tag")
          ZIP=$(node -p "require('./desktop/release-payload/payload-meta.json').zip")
          TITLE="MPASAT desktop ${VERSION}"
          NOTES=desktop/release-payload/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$ZIP" --title "$TITLE" --notes-file "$NOTES"
          fi

      - name: Commit software-manifest.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/software-manifest.json
          if git diff --staged --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git commit -m "chore(desktop): publish payload $(node -p "require('./desktop/software-manifest.json').version") [skip ci]"
          git push
